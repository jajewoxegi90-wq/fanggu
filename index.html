<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="访古">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>访古 · 文保单位探访记录</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="访古">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">访古</span>
    <span class="brand-sub">文保单位探访记录</span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btn-locate" title="定位到我的位置" aria-label="定位">◎</button>
    <button class="icon-btn" id="btn-add" title="添加一处" aria-label="添加">＋</button>
  </div>
</header>

<main>
  <!-- 封面 / 主页 -->
  <section class="view" id="view-home">
    <div class="home">
      <div class="home-hills" aria-hidden="true">
        <svg class="hills" viewBox="0 0 390 150" preserveAspectRatio="none">
          <path d="M0,96 C48,60 84,80 126,66 C170,52 204,84 248,70 C294,55 336,78 390,64 L390,150 L0,150 Z"
                fill="#EDF0E9" stroke="#D5DCCF" stroke-width="1" vector-effect="non-scaling-stroke"/>
          <path d="M0,114 C54,94 92,106 136,98 C182,89 214,110 258,101 C306,91 344,106 390,97 L390,150 L0,150 Z"
                fill="#E3E8E0" stroke="#CFD7CA" stroke-width="1" vector-effect="non-scaling-stroke"/>
        </svg>
        <svg class="waves" viewBox="0 0 390 44" preserveAspectRatio="none">
          <path d="M0,16 Q24,9 48,16 T96,16 T144,16 T192,16 T240,16 T288,16 T336,16 T384,16" fill="none" stroke="#CFC8B6" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
          <path d="M0,25 Q24,18 48,25 T96,25 T144,25 T192,25 T240,25 T288,25 T336,25 T384,25" fill="none" stroke="#D9D2C0" stroke-width="1" vector-effect="non-scaling-stroke"/>
          <path d="M0,34 Q24,27 48,34 T96,34 T144,34 T192,34 T240,34 T288,34 T336,34 T384,34" fill="none" stroke="#E2DCCB" stroke-width="1" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>

      <div class="home-seal" aria-hidden="true">古</div>

      <h1 class="home-title">访 古</h1>
      <div class="home-rule" aria-hidden="true"></div>
      <p class="home-sub">一城一卷 · 记我足迹</p>

      <button class="home-city" id="city-card" type="button">
        <span class="hc-main">
          <span class="hc-name"><span id="home-city-name">杭州</span><span class="hc-region" id="home-city-region">浙江</span></span>
          <span class="hc-meta" id="home-city-meta">164 处 · 已访 0 处</span>
        </span>
        <span class="hc-switch">切换 ›</span>
      </button>

      <button class="home-enter" id="enter-btn" type="button">进 入 地 图</button>
    </div>
  </section>

  <section class="view" id="view-map" hidden>
    <div id="map"></div>
    <div class="map-hint" id="map-hint"></div>
  </section>

  <section class="view" id="view-list" hidden>
    <div class="list-tools">
      <input id="search" type="search" placeholder="搜名称、地址、年代、类型…" autocomplete="off" enterkeyhint="search">
      <div class="chips" id="chips-level"></div>
      <div class="chips" id="chips-visit"></div>
      <div class="count-line" id="list-count"></div>
    </div>
    <div id="list-body"></div>
  </section>

  <section class="view" id="view-me" hidden>
    <div id="me-body"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"></path>
      <circle cx="12" cy="10" r="2.6"></circle>
    </svg>
    <span>地图</span>
  </button>
  <button class="tab" data-view="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M4 6h16M4 12h16M4 18h16"></path>
      <circle cx="2" cy="6" r=".6" fill="currentColor"></circle>
    </svg>
    <span>名录</span>
  </button>
  <button class="tab" data-view="me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.2" r="3.6"></circle>
      <path d="M4.5 20c.9-3.7 3.9-5.6 7.5-5.6s6.6 1.9 7.5 5.6"></path>
    </svg>
    <span>我的</span>
  </button>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
